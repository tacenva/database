
name: Alpha Release

on:
  push:
    branches:
      - alpha

permissions:
  contents: read

concurrency:
  group: alpha-release
  cancel-in-progress: false

jobs:
  release:
    name: Create Alpha Tag & Release
    runs-on: ubuntu-latest

    env:
      BASE_VERSION: "1.0.0"
      TARGET_BRANCH: "alpha"
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
          persist-credentials: true

      - name: Verify branch
        run: |
          if [[ "$GITHUB_REF_NAME" != "$TARGET_BRANCH" ]]; then
            echo "Error: Must run from alpha branch."
            exit 1
          fi

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Generate next version
        id: version
        shell: bash
        run: |
          PREFIX="v${BASE_VERSION}-alpha"

          LAST_TAG=$(git tag --list "${PREFIX}.*" \
            --sort=-version:refname | head -n 1)

          if [[ -z "$LAST_TAG" ]]; then
            NEXT=1
          else
            LAST_NUMBER="${LAST_TAG##*.}"

            if [[ ! "$LAST_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "Invalid tag: $LAST_TAG"
              exit 1
            fi

            NEXT=$((LAST_NUMBER + 1))
          fi

          NEW_TAG="${PREFIX}.${NEXT}"

          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

          echo "Next release: $NEW_TAG"

      - name: Verify token permissions
        run: |
          echo "Authenticated as:"
          gh api user --jq '.login'

          echo "Repository permissions:"
          gh api repos/tacenva/database \
            --jq '.permissions'
            
      - name: Create Git tag
        env:
          NEW_TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Create GitHub Pre-release
        env:
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$NEW_TAG" \
            --title "$NEW_TAG" \
            --generate-notes \
            --prerelease

      - name: Release summary
        env:
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "## Alpha Release Created" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** $NEW_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** $TARGET_BRANCH" >> "$GITHUB_STEP_SUMMARY"
          echo "**Type:** Pre-release" >> "$GITHUB_STEP_SUMMARY"
